name: Unquarantine
options:
  bundleIdPrefix: com.brus.unquarantine
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    # Xcode 16+ injects a __preview.dylib (SwiftUI preview/debug-dylib shim) that breaks
    # the ad-hoc deep code-signing of the .appex on command-line builds. Disable it.
    ENABLE_DEBUG_DYLIB: NO
packages:
  UnquarantineCore:
    path: Core
schemes:
  Unquarantine:
    build:
      targets:
        Unquarantine: all
    test:
      targets:
        - UnquarantineFinderExtensionTests
targets:
  Unquarantine:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.brus.unquarantine.url
            CFBundleURLSchemes: [unquarantine]
        # Agent app: no Dock icon, no auto window. The right-click action runs silently
        # and reports via a notification; a setup window is shown only on direct launch.
        LSUIElement: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Unquarantine.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: UnquarantineCore
      - target: UnquarantineFinderExtension
        embed: true
  UnquarantineFinderExtension:
    type: app-extension
    platform: macOS
    sources: [Extension]
    info:
      path: Extension/Info.plist
      properties:
        CFBundlePackageType: "XPC!"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: UnquarantineCore
  UnquarantineFinderExtensionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ExtensionTests
      - Extension/MenuIconAppearance.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
